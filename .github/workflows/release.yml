name: Release

# Run this workflow from the Actions tab with a version (e.g. 1.0.0), or push a tag like v1.0.0.
# It publishes Clipforge-<version>-AppleSilicon.dmg and -Intel.dmg on the Releases page.
#
# Optional signing and notarization: add these repository secrets and the DMGs are
# signed with your Developer ID and notarized by Apple, so users get no warning.
#   DEVELOPER_ID_P12           base64 of your "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  password of that .p12
#   APPLE_ID                   your Apple ID email
#   APPLE_APP_PASSWORD         app-specific password from appleid.apple.com
#   APPLE_TEAM_ID              10-character team ID
# Without them the app is ad-hoc signed and users must allow it once in
# System Settings → Privacy & Security.

on:
  push:
    tags: ["v*"]
    # Pushing this branch runs everything except publishing, to test the pipeline.
    branches: [release-dry-run]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true

permissions:
  contents: write

env:
  RAW_VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '0.0.0-dryrun' }}

jobs:
  build:
    name: Build ${{ matrix.label }} DMG
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            label: AppleSilicon
          - arch: x86_64
            label: Intel
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out version
        run: echo "VERSION=${RAW_VERSION#v}" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          set -o pipefail
          ARCH=${{ matrix.arch }} BUILD_NUMBER=${{ github.run_number }} ./build.sh 2>&1 | tee build.log || {
            tail -n 8 build.log | while IFS= read -r line; do echo "::error title=build.sh (${{ matrix.label }})::$line"; done
            exit 1
          }

      - name: Check app
        run: |
          lipo -archs build/Clipforge.app/Contents/MacOS/Clipforge | grep -qx ${{ matrix.arch }}
          lipo -archs build/Clipforge.app/Contents/MacOS/ffmpeg | grep -qx ${{ matrix.arch }}
          lipo -archs build/Clipforge.app/Contents/MacOS/ffprobe | grep -qx ${{ matrix.arch }}
          test -f build/Clipforge.app/Contents/Resources/LICENSE
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Clipforge.app/Contents/Info.plist | grep -qx "$VERSION"
          # The Intel ffmpeg only runs here if Rosetta is installed.
          { arch -${{ matrix.arch }} build/Clipforge.app/Contents/MacOS/ffmpeg -hide_banner -version 2>/dev/null | head -1; } > ffmpeg-${{ matrix.arch }}.txt || true
          cat ffmpeg-${{ matrix.arch }}.txt

      - name: Make DMG
        run: |
          set -o pipefail
          scripts/make-dmg.sh "$VERSION" ${{ matrix.label }} 2>&1 | tee dmg.log || {
            tail -n 8 dmg.log | while IFS= read -r line; do echo "::error title=make-dmg (${{ matrix.label }})::$line"; done
            exit 1
          }
          hdiutil attach "build/Clipforge-$VERSION-${{ matrix.label }}.dmg" -mountpoint /tmp/cf -nobrowse
          codesign --verify --strict /tmp/cf/Clipforge.app
          hdiutil detach /tmp/cf

      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="build/Clipforge-$VERSION-${{ matrix.label }}.dmg"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            build/Clipforge-*.dmg
            ffmpeg-${{ matrix.arch }}.txt
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out version
        run: echo "VERSION=${RAW_VERSION#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write release notes
        run: |
          ls -la dist dist/build 2>/dev/null || true
          FFMPEG=$(cat dist/ffmpeg-arm64.txt 2>/dev/null || true)
          {
            echo "## Download"
            echo
            echo "Pick the one for your Mac (Apple menu → **About This Mac** → **Chip** or **Processor**):"
            echo
            echo "| Your Mac says | Download |"
            echo "|---|---|"
            echo "| Chip: Apple M1, M2, M3, M4… | **Clipforge-$VERSION-AppleSilicon.dmg** |"
            echo "| Processor: Intel… | **Clipforge-$VERSION-Intel.dmg** |"
            echo
            echo "Open the DMG and drag Clipforge to Applications. Needs macOS 13 or later."
            echo "The Intel version also runs on Apple Silicon, but slower; the Apple Silicon version does not open on Intel Macs."
            echo
            if [ "$HAS_SIGNING" = "true" ]; then
              echo "Signed and notarized by Apple."
            else
              echo "### First launch"
              echo "This build isn't notarized by Apple, so macOS blocks it the first time:"
              echo "1. Open Clipforge. When macOS says it can't verify it, click **Done**."
              echo "2. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to Clipforge."
              echo "3. Confirm with your password. You only do this once."
              echo
              echo "Or run this once in Terminal after dragging it to Applications:"
              echo '`xattr -dr com.apple.quarantine /Applications/Clipforge.app`'
            fi
            echo
            echo "## What's new"
            echo
            awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2
            echo
            echo "## Licences"
            echo
            echo "Clipforge is GPL-3.0. It bundles ${FFMPEG:-FFmpeg} (GPL)."
            echo "FFmpeg source: https://ffmpeg.org/download.html · builds by https://ffmpeg.martin-riedl.de."
            echo "See THIRD_PARTY_NOTICES.md in the repository."
          } > release-notes.md
          cat release-notes.md

      - name: Check both DMGs are there
        run: |
          shopt -s globstar
          ls -la dist/**/Clipforge-$VERSION-AppleSilicon.dmg dist/**/Clipforge-$VERSION-Intel.dmg

      - name: Publish release
        if: github.ref != 'refs/heads/release-dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            dist/**/Clipforge-$VERSION-AppleSilicon.dmg dist/**/Clipforge-$VERSION-Intel.dmg \
            --title "Clipforge $VERSION" --notes-file release-notes.md
