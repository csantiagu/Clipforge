name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 has Xcode 16: builds the frosted-glass fallback.
        # macos-26 has Xcode 26: builds the real Liquid Glass code path.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Tool versions
        run: |
          sw_vers
          swift --version

      - name: Install ffmpeg (for integration tests)
        run: brew install ffmpeg

      - name: Build app (release)
        run: swift build -c release

      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
          # Surface the totals and any skipped tests on the run page.
          # No match is normal (nothing skipped), so these greps must not fail the step.
          summary=$(grep -E "Executed [0-9]+ tests" test.log | tail -1 || true)
          echo "::notice title=Tests on ${{ matrix.os }}::${summary}"
          { grep -E "Test skipped" test.log || true; } | sed -E 's/.*error: //' | while read -r line; do
            echo "::notice title=Skipped on ${{ matrix.os }}::${line}"
          done

  package:
    name: Package (universal DMG dry run)
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build universal bundle with ffmpeg inside
        run: UNIVERSAL=1 VERSION=0.0.0-ci BUILD_NUMBER=${{ github.run_number }} ./build.sh

      - name: Smoke test
        run: |
          lipo -archs build/Clipforge.app/Contents/MacOS/Clipforge | tee /dev/stderr | grep -q "x86_64 arm64"
          lipo -archs build/Clipforge.app/Contents/MacOS/ffmpeg | grep -q "x86_64 arm64"
          build/Clipforge.app/Contents/MacOS/ffmpeg -hide_banner -version | head -1
          build/Clipforge.app/Contents/MacOS/ffprobe -hide_banner -version | head -1
          test -f build/Clipforge.app/Contents/Resources/LICENSE
          test -f build/Clipforge.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Clipforge.app/Contents/Info.plist

      - name: Make DMG
        run: scripts/make-dmg.sh 0.0.0-ci

      - name: Mount and check DMG
        run: |
          hdiutil attach build/Clipforge-0.0.0-ci.dmg -mountpoint /tmp/cf -nobrowse
          ls -la /tmp/cf
          codesign --verify --strict /tmp/cf/Clipforge.app
          hdiutil detach /tmp/cf

      - uses: actions/upload-artifact@v4
        with:
          name: Clipforge-dmg
          path: build/Clipforge-0.0.0-ci.dmg
          retention-days: 14
