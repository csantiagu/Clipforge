name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 has Xcode 16: builds the frosted-glass fallback.
        # macos-26 has Xcode 26: builds the real Liquid Glass code path.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Tool versions
        run: |
          sw_vers
          swift --version

      - name: Install ffmpeg (for integration tests)
        run: brew install ffmpeg

      - name: Build app (release)
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee build.log || {
            # Post compiler errors on the run page (file, line and message).
            grep -E "^/.*:[0-9]+:[0-9]+: error: " build.log | sort -u | head -20 | while IFS= read -r line; do
              file=$(echo "$line" | cut -d: -f1 | sed "s|^$GITHUB_WORKSPACE/||")
              lineno=$(echo "$line" | cut -d: -f2)
              msg=$(echo "$line" | cut -d: -f5- | sed 's/^ //')
              echo "::error file=$file,line=$lineno::$msg"
            done
            exit 1
          }

      - name: Run tests
        run: |
          set -o pipefail
          status=0
          swift test 2>&1 | tee test.log || status=$?
          # Surface totals, failures and skipped tests on the run page.
          # A grep finding nothing is normal here, so none of them may fail the step.
          summary=$(grep -E "Executed [0-9]+ tests" test.log | tail -1 || true)
          echo "::notice title=Tests on ${{ matrix.os }}::${summary:-no summary (build failed?)}"
          { grep -E ": error: " test.log | grep -v "Test skipped" || true; } | sort -u | head -20 | while IFS= read -r line; do
            echo "::error title=Test failure on ${{ matrix.os }}::${line#$GITHUB_WORKSPACE/}"
          done
          { grep -E "Test skipped" test.log || true; } | sed -E 's/.*error: //' | while IFS= read -r line; do
            echo "::notice title=Skipped on ${{ matrix.os }}::${line}"
          done
          exit $status

  package:
    name: Package ${{ matrix.arch }} DMG (dry run)
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build bundle with ffmpeg inside
        run: |
          set -o pipefail
          ARCH=${{ matrix.arch }} VERSION=0.0.0-ci BUILD_NUMBER=${{ github.run_number }} ./build.sh 2>&1 | tee build.log || {
            tail -n 8 build.log | while IFS= read -r line; do echo "::error title=build.sh (${{ matrix.arch }})::$line"; done
            exit 1
          }

      - name: Smoke test
        run: |
          lipo -archs build/Clipforge.app/Contents/MacOS/Clipforge | grep -qx ${{ matrix.arch }}
          lipo -archs build/Clipforge.app/Contents/MacOS/ffmpeg | grep -qx ${{ matrix.arch }}
          lipo -archs build/Clipforge.app/Contents/MacOS/ffprobe | grep -qx ${{ matrix.arch }}
          arch -${{ matrix.arch }} build/Clipforge.app/Contents/MacOS/ffmpeg -hide_banner -version | head -1 \
            || echo "(could not run ${{ matrix.arch }} ffmpeg on this runner)"
          test -f build/Clipforge.app/Contents/Resources/LICENSE
          test -f build/Clipforge.app/Contents/Resources/AppIcon.icns

      - name: Make DMG
        run: scripts/make-dmg.sh 0.0.0-ci ${{ matrix.arch }}

      - name: Mount and check DMG
        run: |
          hdiutil attach build/Clipforge-0.0.0-ci-${{ matrix.arch }}.dmg -mountpoint /tmp/cf -nobrowse
          ls -la /tmp/cf
          codesign --verify --strict /tmp/cf/Clipforge.app
          hdiutil detach /tmp/cf

      - uses: actions/upload-artifact@v4
        with:
          name: Clipforge-dmg-${{ matrix.arch }}
          path: build/Clipforge-0.0.0-ci-${{ matrix.arch }}.dmg
          retention-days: 14
